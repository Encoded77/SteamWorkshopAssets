<!-- Cybernetics: a host implant at the centre with module slots wired into it,
     two filled and two open — the overhaul's core idea, implants that host
     other implants, and a host's tier capping how many it can carry. -->
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- host core -->
  <rect x="18" y="18" width="12" height="12" stroke="var(--c-accent-500, #efa62c)" stroke-width="2"/>
  <!-- traces out to each slot -->
  <path d="M24 18V12M24 30V36M18 24H12M30 24H36" stroke="var(--c-accent-700, #9a6612)" stroke-width="1.5"/>
  <!-- open slots -->
  <rect x="20" y="6" width="8" height="6" stroke="var(--c-accent-400, #ffc35c)" stroke-width="1.5"/>
  <rect x="6" y="21" width="6" height="6" stroke="var(--c-accent-400, #ffc35c)" stroke-width="1.5"/>
  <!-- installed modules -->
  <rect x="20" y="36" width="8" height="6" fill="var(--c-accent-500, #efa62c)"/>
  <rect x="36" y="21" width="6" height="6" fill="var(--c-accent-500, #efa62c)"/>
</svg>
